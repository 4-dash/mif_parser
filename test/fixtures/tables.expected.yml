elements:
  - class: MifParser::Paragraph
    tag: Body
    raw_text: "Before table."
    type: body
    text: "Before table."

  - class: MifParser::Table
    id: 42
    tag: "Basic Table"
    type: table
    table?: true
    rows:
      - - class: MifParser::Cell
          text: "A1\nSecond paragraph"
          elements:
            - class: MifParser::Paragraph
              raw_text: "A1"
            - class: MifParser::Paragraph
              raw_text: "Second paragraph"
        - class: MifParser::Cell
          text: "B1"
          elements:
            - class: MifParser::Paragraph
              raw_text: "B1"
      - - class: MifParser::Cell
          text: "A2"
          elements:
            - class: MifParser::Paragraph
              raw_text: "A2"
        - class: MifParser::Cell
          text: "B2"
          elements:
            - class: MifParser::Paragraph
              raw_text: "B2"

  - class: MifParser::Paragraph
    raw_text: "After table."
    type: body
    text: "After table."
